name: blog-publish

on:
  pull_request:
    paths:
      - 'content/posts/**'
      - 'scripts/**'
      - '.github/workflows/blog-publish.yml'
  push:
    branches: ['main']
    paths:
      - 'content/posts/**'
      - 'scripts/**'
      - '.github/workflows/blog-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate frontmatter schema
        run: node scripts/validate-frontmatter.mjs content/posts

  build:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref_name == 'main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build static site
        run: node scripts/build-site.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
