name: blog-publish

on:
  pull_request:
    paths:
      - 'src/content/posts/**'
      - 'scripts/**'
      - '.github/workflows/blog-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate frontmatter schema
        run: node scripts/validate-frontmatter.mjs

      - name: Validate workflow branch policy
        run: node scripts/validate-workflow-policy.mjs
